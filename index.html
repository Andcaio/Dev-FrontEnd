<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=MedievalSharp&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Laboratório de Alquimia &amp; Feitiçaria</title>
    <script type="module" src="js/app.js"></script>
</head>
<body>
  <header>
    <h1>Laboratório de Alquimia &amp; Feitiçaria</h1>
  </header>

  <main>
    <!-- Região de Busca e Filtros -->
    <section aria-labelledby="titulo-busca-filtros">
      <h2 id="titulo-busca-filtros">🔮 Pesquisa Arcana</h2>
      <form role="search">
        <p>
          <label for="busca-titulo">Buscar por nome da poção ou feitiço:</label>
          <input type="search" id="busca-titulo" name="busca">
        </p>

        <p>
          <label for="filtro-status">Filtrar por estágio alquímico:</label>
          <select id="filtro-status" name="status">
            <option value="">Todos os Estágios</option>
            <option value="a-fazer">📜 Grimório / Receitas</option>
            <option value="em-andamento">🧪 No Caldeirão</option>
            <option value="em-revisao">🔍 Teste de Pureza</option>
            <option value="concluida">✨ Poção Pronta</option>
          </select>
        </p>

        <fieldset>
          <legend>Potência Mágica</legend>
          <label for="prio-todas">
            <input type="radio" id="prio-todas" name="prioridade" value="todas" checked>
            Todas
          </label>
          <label for="prio-baixa">
            <input type="radio" id="prio-baixa" name="prioridade" value="baixa">
            Baixa
          </label>
          <label for="prio-media">
            <input type="radio" id="prio-media" name="prioridade" value="media">
            Moderada
          </label>
          <label for="prio-alta">
            <input type="radio" id="prio-alta" name="prioridade" value="alta">
            Extrema
          </label>
        </fieldset>

        <button type="submit">Conjurar Filtros</button>
      </form>
    </section>

    <!-- Região viva: existe desde o primeiro byte do documento e nasce vazia.
         O JavaScript preenche o texto a cada troca de estado, e o leitor de
         tela anuncia a mudança sem interromper o que a pessoa está fazendo. -->
    <p id="regiao-status" class="apenas-leitor-de-tela" role="status" aria-live="polite"></p>

    <!-- Painel dos estados de carregando, vazio e erro. Nasce escondido; o
         JavaScript acende exatamente um estado por vez. -->
    <div id="painel-estado" hidden>
      <p id="painel-icone" aria-hidden="true"></p>
      <p id="painel-titulo"></p>
      <p id="painel-detalhe"></p>
      <button type="button" id="botao-tentar-novamente" hidden>Refazer o ritual</button>
    </div>

    <!-- Contagem visível do estado de sucesso. -->
    <p id="resumo-quadro" hidden></p>

    <noscript>
      <p>Este laboratório precisa de JavaScript habilitado para consultar o grimório de fórmulas.</p>
    </noscript>

    <!-- Quadro: as quatro colunas nascem vazias e são preenchidas por
         renderizacao.js a partir do array devolvido por api.js. -->
    <div id="quadro" hidden>
      <!-- Agrupamento 1: Grimório / Receitas -->
      <section aria-labelledby="status-grimorio">
        <h2 id="status-grimorio">📜 Grimório / Receitas</h2>
        <ul data-lista-status="a-fazer"></ul>
      </section>

      <!-- Agrupamento 2: No Caldeirão -->
      <section aria-labelledby="status-caldeirao">
        <h2 id="status-caldeirao">🧪 No Caldeirão</h2>
        <ul data-lista-status="em-andamento"></ul>
      </section>

      <!-- Agrupamento 3: Teste de Pureza -->
      <section aria-labelledby="status-pureza">
        <h2 id="status-pureza">🔍 Teste de Pureza</h2>
        <ul data-lista-status="em-revisao"></ul>
      </section>

      <!-- Agrupamento 4: Poção Pronta -->
      <section aria-labelledby="status-pocao">
        <h2 id="status-pocao">✨ Poção Pronta</h2>
        <ul data-lista-status="concluida"></ul>
      </section>
    </div>
  </main>

  <footer>
    <p>Forjado por <strong>Caio Dias</strong> — Mestre-Alquimista de Front-End</p>
  </footer>
</body>
</html>
