  <main>
    <!-- Região de Busca e Filtros -->
    <section aria-labelledby="titulo-busca-filtros">
      <h2 id="titulo-busca-filtros">Busca e Filtros</h2>
      <form role="search">
        <p>
          <label for="busca-titulo">Buscar por título da tarefa:</label>
          <input type="search" id="busca-titulo" name="busca">
        </p>

        <p>
          <label for="filtro-status">Filtrar por status:</label>
          <select id="filtro-status" name="status">
            <option value="">Todos os status</option>
            <option value="a-fazer">A Fazer</option>
            <option value="em-andamento">Em Andamento</option>
            <option value="em-revisao">Em Revisão</option>
            <option value="concluida">Concluída</option>
          </select>
        </p>

        <fieldset>
          <legend>Filtrar por prioridade</legend>
          <label for="prio-todas">
            <input type="radio" id="prio-todas" name="prioridade" value="todas" checked>
            Todas
          </label>
          <label for="prio-baixa">
            <input type="radio" id="prio-baixa" name="prioridade" value="baixa">
            Baixa
          </label>
          <label for="prio-media">
            <input type="radio" id="prio-media" name="prioridade" value="media">
            Média
          </label>
          <label for="prio-alta">
            <input type="radio" id="prio-alta" name="prioridade" value="alta">
            Alta
          </label>
        </fieldset>

        <button type="submit">Aplicar Filtros</button>
      </form>
    </section>
